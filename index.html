  <style>
    :root {
      --bg-primary: #0d1015;
      --bg-secondary: #151a23;
      --bg-card: #1b222e;
      --bg-card-hover: #222b3a;
      --border-color: #2c3648;
      --gold: #d4af37;
      --gold-dim: #9e8127;
      --teal: #4fd1c5;
      --teal-dim: rgba(79, 209, 197, 0.15);
      --danger: #f56565;
      --text-main: #edf2f7;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 1.65rem;
      letter-spacing: 0.06em;
      color: var(--gold);
      font-weight: 700;
    }

    header p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* タイマーメインパネル */
    .timer-panel {
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-card) 100%);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.78rem;
      padding: 3px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .status-badge.running {
      background: var(--teal-dim);
      color: var(--teal);
      border: 1px solid rgba(79, 209, 197, 0.35);
    }
